spring:
  datasource:
    url: jdbc:h2:file:./data/pos_system_db   # 🔥 changed from mem → file
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update   # ✅ keep data, only update schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true